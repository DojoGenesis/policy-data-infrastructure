notes              = """
Semi-annual (June and December) county-level data on residential fixed broadband Internet access
service connections. {period} is a monYYYY token (e.g. jun2024, dec2024) — ingest/
fetch_fcc_broadband.py currently HARDCODES FCC_COUNTY_CSV_URL to "...jun2024.csv" with a TODO
comment to update it manually each semi-annual release; there is no automatic latest-release
discovery. If the fetch 404s, that hardcoded period is almost certainly stale — check
https://www.fcc.gov/form-477-county-data-internet-access-services for the current filename.

Key variables: fcc_broadband_access_pct (connections per 1,000 households, county-level),
fcc_multiple_providers_pct (% of tracts in the county with 2+ providers, county-level).
Tract-level data exists at the separate URL
https://www.fcc.gov/form-477-census-tract-data-internet-access-services but is NOT implemented
by either the Go adapter or the Python script — both parse the county-level file only.

