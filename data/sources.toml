`return nil, nil` — a SILENT empty success, not an error, not a 501. Calling the Go adapter
directly gives you zero indicators and zero diagnostics; it will not tell you to go run the
Python script. Real ingestion runs through ingest/fetch_fcc_broadband.py; this is the sharpest
version of the "government API silent data drop" pattern in this codebase because the silence is
in this repo's own Go code, not an upstream API. CSV download, no API key required.
