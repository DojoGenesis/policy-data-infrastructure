FBI Crime Data Explorer (CDE) API providing NIBRS estimation data.
Requires an api.data.gov API key (sign up at https://api.data.gov/signup/).
Key variables: fbi_violent_crime_rate, fbi_property_crime_rate (both per 100,000 population —
note the fbi_ prefix on the actual VariableDef IDs in fbi_nibrs.go).
NIBRS estimation tables provide national estimates based on agency submissions.
Null handling: suppressed values (FBI suppresses populations with fewer than 10 reported
incidents) appear as raw "-1", "null", or "" and are converted to nil *float64.
