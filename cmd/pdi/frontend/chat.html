<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDI Chat — Ask the Data</title>
<meta name="description" content="Ask questions about Wisconsin county indicators, policy positions, and equity data. Every answer is verified against live data — no AI confabulation.">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/styles.css">
<style>
  .chat-page { display:flex; flex-direction:column; height:calc(100vh - 56px); max-width:800px; margin:0 auto; }
  .chat-messages { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
  .chat-msg { max-width:80%; padding:14px 18px; border-radius:var(--r-card); line-height:1.55; font-size:15px; }
  .chat-msg.user { align-self:flex-end; background:var(--accent); color:var(--bg); border-bottom-right-radius:6px; }
  .chat-msg.assistant { align-self:flex-start; background:var(--surface); color:var(--text); border:1px solid var(--border); border-bottom-left-radius:6px; }
  .chat-msg.assistant p { margin:0 0 8px; }
  .chat-msg.assistant p:last-child { margin:0; }
  .chat-msg.assistant strong { color:var(--accent); }
  .chat-msg.system { align-self:center; background:transparent; color:var(--muted); font-size:13px; text-align:center; max-width:100%; padding:8px; }
  .chat-input-wrap { padding:16px 24px 24px; border-top:1px solid var(--border); background:var(--bg); }
  .chat-input-row { display:flex; gap:10px; }
  .chat-input { flex:1; padding:12px 16px; border:1px solid var(--border-strong); border-radius:var(--r-card); background:var(--surface); color:var(--text); font-size:15px; font-family:var(--font-sans); outline:none; }
  .chat-input:focus { border-color:var(--accent); }
  .chat-send { padding:12px 20px; background:var(--accent); color:var(--bg); border:none; border-radius:var(--r-card); font-weight:600; font-size:14px; cursor:pointer; font-family:var(--font-sans); }
  .chat-send:hover { filter:brightness(1.1); }
  .chat-send:disabled { opacity:0.5; cursor:default; }
  .chat-placeholders { display:flex; flex-wrap:wrap; gap:8px; padding:0 24px 16px; }
  .chat-placeholder { padding:8px 14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-chip); font-size:13px; color:var(--muted); cursor:pointer; transition:border-color 0.15s; }
  .chat-placeholder:hover { border-color:var(--accent); color:var(--text); }
  .chat-thinking { display:flex; align-items:center; gap:6px; padding:14px 18px; color:var(--muted); font-size:14px; }
  .chat-thinking .dot { width:6px; height:6px; border-radius:50%; background:var(--accent); animation:pulse 1.4s infinite; }
  .chat-thinking .dot:nth-child(2) { animation-delay:0.2s; }
  .chat-thinking .dot:nth-child(3) { animation-delay:0.4s; }
  @keyframes pulse { 0%,80%,100% { opacity:0.3; } 40% { opacity:1; } }
  .chat-badge { display:inline-block; padding:2px 8px; border-radius:var(--r-badge); font-size:11px; font-weight:600; margin-right:4px; }
  .chat-badge.reliability-high { background:var(--live); color:var(--bg); }
  .chat-badge.reliability-moderate { background:var(--gated); color:var(--bg); }
  .chat-badge.source { background:var(--border); color:var(--muted); }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:56px;">
    <div style="display:flex;align-items:center;gap:24px;">
      <a href="/" style="font-weight:700;font-size:18px;color:var(--text);text-decoration:none;"><span style="color:var(--accent);">PDI</span> <span style="font-weight:300;color:var(--muted);">Chat</span></a>
      <nav style="display:flex;gap:4px;font-size:14px;">
        <a href="/" style="color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:6px;">Explorer</a>
        <a href="/compare" style="color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:6px;">Compare</a>
        <a href="/map" style="color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:6px;">Map</a>
        <a href="/about" style="color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:6px;">About</a>
      </nav>
    </div>
  </div>
</header>

<main class="chat-page">
  <div id="messages" class="chat-messages">
    <div class="chat-msg system">
      <p style="font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px;">Ask the Data</p>
      <p>I can answer questions about Wisconsin's 72 counties — poverty rates, income, health outcomes, housing costs, and how 85 policy positions connect to local conditions. Every number I give you is verified against live Census and CDC data.</p>
    </div>
  </div>

  <div id="placeholders" class="chat-placeholders"></div>

  <div class="chat-input-wrap">
    <div class="chat-input-row">
      <input id="input" class="chat-input" type="text" placeholder="Ask about Wisconsin counties, indicators, or policies..." autofocus>
      <button id="send" class="chat-send" onclick="sendMessage()">Send</button>
    </div>
  </div>
</main>

<script src="/static/lib/api.js"></script>
<script src="/static/lib/domain.js"></script>
<script src="/static/lib/chat.js"></script>
<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const placeholdersEl = document.getElementById('placeholders');

  // Load placeholder suggestions
  if (ChatAdapter._placeholders) {
    ChatAdapter._placeholders.forEach(p => {
      const el = document.createElement('span');
      el.className = 'chat-placeholder';
      el.textContent = p.length > 100 ? p.slice(0,97) + '...' : p;
      el.onclick = () => { input.value = p; sendMessage(); };
      placeholdersEl.appendChild(el);
    });
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    if (role === 'assistant') {
      div.innerHTML = text.replace(/\n/g,'<br>');
    } else {
      div.textContent = text;
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function addThinking() {
    const div = document.createElement('div');
    div.className = 'chat-thinking';
    div.id = 'thinking';
    div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span> Thinking...';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinking');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    addMessage('user', text);
    addThinking();

    try {
      const reply = await ChatAdapter.send(text);
      removeThinking();
      addMessage('assistant', reply);
    } catch (e) {
      removeThinking();
      addMessage('system', 'Sorry, something went wrong. The chat service may be unavailable. Try again in a moment.');
    }

    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
