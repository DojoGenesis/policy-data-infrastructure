<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector de Narrativas — PDI</title>
<meta name="description" content="Lector de narrativas políticas — perfiles de secciones censales, paneles de indicadores y recomendaciones de palancas políticas.">

<!-- hreflang -->
<link rel="alternate" hreflang="en" href="/narrative">
<link rel="alternate" hreflang="es" href="/es/narrative">

<!-- Design tokens — Night Shift + Rainbow, all colors via var() -->
<link rel="stylesheet" href="/static/tokens.css">

<!-- PDI layout layer — cards, tables, badges, nav -->
<link rel="stylesheet" href="/static/styles.css">

<!-- Alpine.js — local, no CDN -->
<script defer src="/static/alpine.min.js"></script>

<style>
  [x-cloak] { display: none !important; }

  /* ── Narrative Reader · page-specific ───────────────────────────── */

  /* ── Two-column layout: sidebar + prose ─────────────────────────── */
  .narrative-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: clamp(24px, 4vw, 48px);
    align-items: start;
    max-width: calc(var(--wrap-narrow, 880px) + 220px + 48px);
    margin-inline: auto;
    padding-inline: clamp(16px, 3vw, 24px);
  }

  /* ── Chapter Sidebar ────────────────────────────────────────────── */
  .chapter-sidebar {
    position: sticky;
    top: clamp(80px, 10vw, 100px); /* below site header + some breathing room */
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    scrollbar-width: thin;
  }

  .chapter-sidebar .sidebar-label {
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 0.6em;
  }

  .chapter-sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .chapter-link {
    display: block;
    padding: 0.45em 0.65em;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    border-radius: var(--r-badge);
    border-left: 2px solid transparent;
    transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
  }
  .chapter-link:hover {
    color: var(--text);
    background: var(--surface);
    border-left-color: var(--border-strong);
  }
  .chapter-link.active {
    color: var(--text);
    font-weight: 600;
    border-left-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .chapter-link-num {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--accent);
    margin-right: 0.35em;
  }

  /* ── Toolbar (between header and prose) ─────────────────────────── */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: clamp(16px, 2.5vw, 24px);
  }

  .toolbar .btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  /* Copy-toast */
  .copy-toast {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--live);
    animation: toast-in 200ms ease;
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Prose container ──────────────────────────────────────────── */
  .prose {
    padding: 0 0 clamp(48px, 8vw, 96px);
  }

  /* The narrative HTML is self-styled but we override its root to
     use our dark tokens and system fonts. Specificity via .prose parent. */
  .prose :where(h1, h2, h3, h4, h5, h6) {
    color: var(--text);
  }

  .prose :where(p) {
    color: var(--text);
  }

  /* ── Narrative cover override ─────────────────────────────────── */
  .prose .cover {
    background: color-mix(in srgb, var(--accent) 5%, var(--surface));
    color: var(--text);
    border-radius: var(--r-card);
    padding: clamp(40px, 8vw, 80px) clamp(20px, 4vw, 40px);
    margin-bottom: clamp(32px, 5vw, 56px);
  }
  .prose .cover::before { display: none; }
  .prose .cover h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
  }
  .prose .cover .subtitle {
    color: var(--muted);
  }
  .prose .cover-meta {
    color: var(--subtle);
    opacity: 1;
  }
  .prose .cover-scroll { display: none; }

  /* ── Narrative intro ──────────────────────────────────────────── */
  .prose .intro {
    margin-bottom: clamp(24px, 4vw, 40px);
  }
  .prose .intro .lead {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ── Narrative TOC ────────────────────────────────────────────── */
  .prose .toc {
    display: none; /* we build our own chapter nav instead */
  }

  /* ── Chapter sections ─────────────────────────────────────────── */
  .prose .chapter {
    max-width: none;
    margin: 0 0 clamp(40px, 6vw, 64px);
    padding: 0;
    border-top: 1px solid var(--border);
    padding-top: clamp(28px, 4vw, 40px);
  }
  .prose .chapter:first-of-type {
    border-top: none;
    padding-top: 0;
  }

  .prose .chapter-header {
    margin-bottom: clamp(20px, 3vw, 32px);
  }
  .prose .chapter-number {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.35em;
  }
  .prose .chapter h2 {
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-weight: 700;
    color: var(--text);
  }
  .prose .chapter-location {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.3em;
  }
  .prose .tier-badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.2em 0.55em;
    border-radius: var(--r-badge);
    margin-left: 0.5em;
    vertical-align: middle;
  }
  .prose .tier-badge.critical {
    color: var(--gated);
    background: color-mix(in srgb, var(--gated) 14%, transparent);
  }
  .prose .tier-badge.warning {
    color: var(--gated);
    background: color-mix(in srgb, var(--gated) 8%, transparent);
  }
  .prose .tier-badge.neutral {
    color: var(--info);
    background: color-mix(in srgb, var(--info) 12%, transparent);
  }
  .prose .tier-badge.positive {
    color: var(--live);
    background: color-mix(in srgb, var(--live) 12%, transparent);
  }

  /* ── Narrative prose text ─────────────────────────────────────── */
  .prose .narrative {
    margin-bottom: clamp(20px, 3vw, 28px);
  }
  .prose .narrative p {
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 1.15em;
  }

  /* ── Stat callout row ─────────────────────────────────────────── */
  .prose .stat-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: clamp(16px, 2.5vw, 24px) 0 clamp(24px, 3.5vw, 32px);
  }
  .prose .stat-block {
    flex: 1 1 130px;
    min-width: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-badge);
    padding: 12px 14px;
    text-align: center;
  }
  .prose .stat-block.critical {
    background: color-mix(in srgb, var(--gated) 8%, var(--surface));
    border-color: color-mix(in srgb, var(--gated) 20%, transparent);
  }
  .prose .stat-block.warning {
    background: color-mix(in srgb, var(--gated) 5%, var(--surface));
    border-color: color-mix(in srgb, var(--gated) 15%, transparent);
  }
  .prose .stat-block.neutral {
    background: color-mix(in srgb, var(--info) 5%, var(--surface));
    border-color: color-mix(in srgb, var(--info) 15%, transparent);
  }
  .prose .stat-block.positive {
    background: color-mix(in srgb, var(--live) 5%, var(--surface));
    border-color: color-mix(in srgb, var(--live) 15%, transparent);
  }
  .prose .stat-big {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text);
    font-family: var(--font-mono);
  }
  .prose .stat-block.critical .stat-big { color: var(--gated); }
  .prose .stat-block.warning  .stat-big { color: var(--gated); }
  .prose .stat-block.neutral  .stat-big { color: var(--info); }
  .prose .stat-block.positive .stat-big { color: var(--live); }
  .prose .stat-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-top: 0.3em;
  }
  .prose .stat-context {
    font-size: 0.62rem;
    color: var(--subtle);
    margin-top: 0.15em;
  }

  /* ── Indicator table ──────────────────────────────────────────── */
  .prose .indicator-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    margin: clamp(16px, 2.5vw, 28px) 0;
  }
  .prose .indicator-table th {
    text-align: left;
    padding: 0.55em 0.7em;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border-strong);
  }
  .prose .indicator-table td {
    padding: 0.5em 0.7em;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .prose .indicator-table tr:last-child td { border-bottom: none; }
  .prose .indicator-table .val-cell {
    font-weight: 700;
    text-align: right;
    font-family: var(--font-mono);
  }

  /* ── Policy lever box ─────────────────────────────────────────── */
  .prose .policy-lever {
    background: color-mix(in srgb, var(--accent) 5%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 15%, transparent);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-badge);
    padding: clamp(14px, 2vw, 20px) clamp(16px, 2.5vw, 24px);
    margin: clamp(16px, 2.5vw, 28px) 0;
  }
  .prose .policy-lever-label {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5em;
  }
  .prose .policy-lever-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.5em;
  }
  .prose .policy-lever p {
    font-size: 0.85rem;
    line-height: 1.65;
    color: var(--muted);
    margin-bottom: 0.6em;
  }
  .prose .policy-lever p:last-child { margin-bottom: 0; }
  .prose .policy-lever .evidence-list {
    list-style: none;
    padding: 0;
    margin: 0.6em 0 0;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.55;
  }
  .prose .policy-lever .evidence-list li {
    padding: 0.3em 0 0.3em 1.2em;
    position: relative;
  }
  .prose .policy-lever .evidence-list li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  /* ── Section divider ──────────────────────────────────────────── */
  .prose .section-divider {
    display: none;
  }

  /* ── Scope stats (intro) ──────────────────────────────────────── */
  .prose .scope-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: clamp(16px, 2.5vw, 24px) 0;
  }

  /* ── Methodology ──────────────────────────────────────────────── */
  .prose .methodology {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: clamp(20px, 3vw, 36px) clamp(16px, 2.5vw, 28px);
    margin: clamp(32px, 5vw, 56px) 0;
  }
  .prose .methodology-inner {
    max-width: none;
  }
  .prose .methodology h2 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.8em;
  }
  .prose .methodology p {
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--muted);
  }

  /* ── Footnotes ────────────────────────────────────────────────── */
  .prose .footnotes {
    margin: 0 auto;
    padding: clamp(24px, 4vw, 40px) 0;
    border-top: 1px solid var(--border);
  }
  .prose .footnotes h3 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.8em;
  }
  .prose .footnotes ol,
  .prose .footnotes ul {
    padding-left: 1.2em;
    font-size: 0.8rem;
    color: var(--subtle);
    line-height: 1.7;
  }
  .prose .footnotes li { margin-bottom: 0.3em; }

  /* ── Generated stamp ──────────────────────────────────────────── */
  .prose .generated-stamp {
    font-size: 0.7rem;
    color: var(--subtle);
    padding: 0 0 24px;
    text-align: center;
  }

  /* ── Skeleton loader ──────────────────────────────────────────── */
  .prose-skeleton {
    padding-top: clamp(24px, 4vw, 40px);
    max-width: 72ch;
    margin-inline: auto;
  }
  .prose-skeleton .skeleton-line {
    height: 0.85em;
    margin-bottom: 0.75em;
    border-radius: 4px;
  }
  .prose-skeleton .skeleton-line:nth-child(1) { width: 60%; height: 1.5em; margin-bottom: 1.25em; }
  .prose-skeleton .skeleton-line:nth-child(2) { width: 90%; }
  .prose-skeleton .skeleton-line:nth-child(3) { width: 85%; }
  .prose-skeleton .skeleton-line:nth-child(4) { width: 92%; }
  .prose-skeleton .skeleton-line:nth-child(5) { width: 70%; margin-bottom: 2em; }
  .prose-skeleton .skeleton-line:nth-child(6) { width: 50%; height: 1.2em; margin-bottom: 1em; }
  .prose-skeleton .skeleton-line:nth-child(7) { width: 88%; }
  .prose-skeleton .skeleton-line:nth-child(8) { width: 75%; }
  .prose-skeleton .skeleton-line:nth-child(9) { width: 82%; }
  .prose-skeleton .skeleton-line:nth-child(10) { width: 65%; }

  /* ── Responsive ───────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .narrative-layout {
      grid-template-columns: 1fr;
      gap: 0;
    }
    .chapter-sidebar {
      position: static;
      max-height: none;
      overflow-y: visible;
      margin-bottom: clamp(16px, 3vw, 24px);
      padding-bottom: clamp(12px, 2vw, 16px);
      border-bottom: 1px solid var(--border);
    }
    .chapter-sidebar nav {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 4px;
    }
    .chapter-link {
      border-left: none;
      border-bottom: 2px solid transparent;
      font-size: 0.72rem;
      padding: 0.35em 0.55em;
    }
    .chapter-link.active {
      border-left: none;
      border-bottom-color: var(--accent);
    }
  }

  @media (max-width: 600px) {
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .prose .stat-row {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/es/" class="site-logo"><span class="site-logo-accent">PDI</span> Policy Data Infrastructure</a>
    <nav class="site-nav">
      <a href="/es/">Explorador</a>
      <a href="/es/compare">Comparar</a>
      <a href="/es/map">Mapa</a>
      <a href="/es/chat">Chat</a>
      <a href="/es/about">Acerca de</a>
    </nav>
  </div>
</header>

<main x-data="narrativeReader()" x-init="init()">
  <!-- ── Toolbar ── -->
  <div class="wrap-narrow" style="padding-top:clamp(24px,4vw,40px);">
    <div class="toolbar">
      <a href="/es/" class="btn btn-ghost">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Volver al Explorador
      </a>
      <span style="font-size:0.8rem;color:var(--subtle);" x-text="geoid ? 'GEOID: ' + geoid : ''"></span>
      <button class="btn btn-ghost" @click="copyLink()" style="margin-left:auto;" x-show="geoid">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copiar enlace
      </button>
    </div>
    <div x-show="copyMessage" x-cloak class="copy-toast" x-text="copyMessage"></div>
  </div>

  <!-- ── Loading ── -->
  <div x-show="loading" x-cloak class="prose-skeleton">
    <template x-for="i in 10" :key="i">
      <div class="skeleton-line skeleton"></div>
    </template>
  </div>

  <!-- ── Error ── -->
  <div x-show="error" x-cloak class="wrap-narrow state-error" style="padding:clamp(32px,5vw,64px) 0;">
    <p x-text="error"></p>
    <button class="btn btn-secondary" @click="init()">Reintentar</button>
  </div>

  <!-- ── No geoid ── -->
  <div x-show="!loading && !error && !geoid" x-cloak class="wrap-narrow state-empty" style="padding:clamp(48px,6vw,80px) 0;">
    <h2 style="color:var(--text);font-size:1.1rem;margin-bottom:0.5em;">Narrativa Política</h2>
    <p>Selecciona un condado del <a href="/es/" style="color:var(--accent);">Explorador de Condados</a> y haz clic en "Generar Informe" para ver una narrativa detallada.</p>
  </div>

  <!-- ── Narrative content ── -->
  <div x-show="!loading && !error && narrative" x-cloak class="narrative-layout">

    <!-- ── Chapter Sidebar ── -->
    <aside class="chapter-sidebar">
      <div class="sidebar-label">CAPÍTULOS</div>
      <nav>
        <template x-for="(ch, idx) in chapters" :key="ch.id">
          <a
            :href="'#' + ch.id"
            class="chapter-link"
            :class="{ active: activeChapter === ch.id }"
            @click.prevent="scrollToChapter(ch.id)"
          >
            <span class="chapter-link-num" x-text="(idx + 1).toString().padStart(2, '0')"></span>
            <span x-text="ch.title"></span>
          </a>
        </template>
      </nav>
    </aside>

    <!-- ── Prose ── -->
    <div class="prose" id="prose" x-html="narrative"></div>
  </div>
</main>

<footer class="site-footer">
  Policy Data Infrastructure · <a href="https://github.com/DojoGenesis/policy-data-infrastructure" target="_blank" rel="noopener">DojoGenesis</a> · Apache-2.0
</footer>

<script>
function narrativeReader() {
  return {
    geoid: '',
    narrative: null,
    chapters: [],
    activeChapter: '',
    loading: true,
    error: '',
    copyMessage: '',

    async init() {
      this.geoid = new URLSearchParams(window.location.search).get('geoid') || '';
      if (!this.geoid) { this.loading = false; return; }

      this.loading = true;
      this.error = '';
      try {
        const resp = await fetch('/v1/policy/narratives?geoid=' + this.geoid);
        if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
        const data = await resp.json();
        this.narrative = data.html || data.narrative || '<p>No se generó contenido narrativo.</p>';
        this.chapters = data.chapters || [];
        if (this.chapters.length > 0) {
          this.activeChapter = this.chapters[0].id;
        }
      } catch (e) {
        this.error = 'Error al cargar la narrativa: ' + e.message;
      } finally {
        this.loading = false;
      }
    },

    scrollToChapter(id) {
      this.activeChapter = id;
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    },

    async copyLink() {
      try {
        await navigator.clipboard.writeText(window.location.href);
        this.copyMessage = '¡Enlace copiado!';
      } catch (_) {
        this.copyMessage = 'No se pudo copiar el enlace';
      }
      setTimeout(() => { this.copyMessage = ''; }, 2000);
    },
  };
}

// Intersection observer for active chapter tracking
document.addEventListener('alpine:init', () => {
  // Runs after Alpine initializes
  setTimeout(() => {
    const prose = document.getElementById('prose');
    if (!prose) return;
    const chapters = prose.querySelectorAll('.chapter');
    if (chapters.length === 0) return;

    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          const chapterEl = entry.target;
          const id = chapterEl.id;
          if (id) {
            const links = document.querySelectorAll('.chapter-link');
            links.forEach(link => {
              link.classList.toggle('active', link.getAttribute('href') === '#' + id);
            });
          }
        }
      }
    }, { rootMargin: '-20% 0px -60% 0px' });

    chapters.forEach(ch => observer.observe(ch));
  }, 500);
});
</script>

</body>
</html>
