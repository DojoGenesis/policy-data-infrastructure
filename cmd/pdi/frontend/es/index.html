<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>(function(d){var r=d.documentElement;r.classList.add('js');
try{var t=localStorage.getItem('tp-theme');if(t==='light'||t==='dark'){r.setAttribute('data-theme',t);}}catch(e){}
if(d.hidden){r.classList.add('motion-failed');}
window.__tpMotionFailsafe=setTimeout(function(){r.classList.add('motion-failed');},2000);})(document);</script>
<style>html.motion-failed .reveal,html.motion-failed .reveal.in{opacity:1!important;transform:none!important;transition:none!important}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDI — Explorador de Condados</title>
<meta name="description" content="Explorador de Condados de Wisconsin — selecciona un condado para ver indicadores detallados de la plataforma Policy Data Infrastructure.">

<!-- hreflang -->
<link rel="alternate" hreflang="en" href="/">
<link rel="alternate" hreflang="es" href="/es/">

<!-- Design tokens — Night Shift + Rainbow, all colors via var() -->
<link rel="stylesheet" href="/static/tokens.css">

<!-- Motion — scroll-triggered reveals with failsafe -->
<link rel="stylesheet" href="/static/motion.css">

<!-- PDI layout layer — cards, tables, badges, nav -->
<link rel="stylesheet" href="/static/styles.css">

<!-- Alpine.js — local, no CDN -->
<script defer src="/static/alpine.min.js"></script>

<style>
  [x-cloak] { display: none !important; }

  /* ── County Explorer page-specific ──────────────────────────── */
  .county-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(10px, 1.5vw, 16px);
  }

  .county-card {
    cursor: pointer;
    padding: clamp(12px, 2vw, 18px);
  }

  .county-card-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .county-card-geoid {
    font-size: 0.7rem;
    color: var(--subtle);
    margin-top: 2px;
    font-family: var(--font-mono);
  }

  .county-card-pop {
    margin-top: clamp(6px, 1vw, 10px);
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .county-card-pop-val {
    font-size: clamp(1.1rem, 2.2vw, 1.35rem);
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .county-card-pop-label {
    font-size: 0.65rem;
    color: var(--subtle);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* ── Skeleton card placeholders ─────────────────────────────── */
  .skeleton-card .skeleton-line {
    height: 0.85em;
    border-radius: 4px;
  }

  .skeleton-card .skeleton-line:first-child {
    width: 75%;
    margin-bottom: 10px;
  }

  .skeleton-card .skeleton-line:nth-child(2) {
    width: 50%;
    margin-bottom: 18px;
  }

  .skeleton-card .skeleton-line:nth-child(3) {
    width: 60%;
    height: 1.15em;
  }

  /* ── Search input ───────────────────────────────────────────── */
  .search-wrap {
    max-width: 420px;
    margin-bottom: clamp(16px, 2.5vw, 28px);
  }

  /* ── Hero ───────────────────────────────────────────────────── */
  .hero {
    margin-bottom: clamp(20px, 3vw, 36px);
  }

  .hero h1 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }

  .hero-subtitle {
    font-size: 0.875rem;
    color: var(--muted);
    margin: 0;
  }

  /* ── Footer ─────────────────────────────────────────────────── */
  .site-footer {
    border-top: 1px solid var(--border);
    margin-top: clamp(32px, 5vw, 56px);
    padding: clamp(16px, 2.5vw, 24px) 0;
    text-align: center;
    font-size: 0.75rem;
    color: var(--subtle);
  }

  .site-footer a {
    color: var(--accent);
    text-decoration: none;
  }

  .site-footer a:hover {
    text-decoration: underline;
  }

  /* ── Chat toggle button ─────────────────────────────────────── */
  .chat-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
  }

  .chat-toggle:hover {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: var(--text);
    border-color: var(--accent);
  }

  /* ── Responsive grid ────────────────────────────────────────── */
  @media (max-width: 1100px) {
    .county-grid {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  @media (max-width: 700px) {
    .county-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 420px) {
    .county-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
  <link rel="stylesheet" href="/static/chat-drawer.css">
</head>
<body>

<!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
<header class="site-header">
  <div class="site-header-inner">
    <a href="/es/" class="site-logo">
      <span class="site-logo-accent">PDI</span> Explorador de Datos
    </a>

    <nav class="site-nav" aria-label="Navegación principal">
      <a href="/es/" aria-current="page">Condados</a>
      <a href="/es/compare">Comparar</a>
      <a href="/es/evidence">Evidencia</a>
      <a href="/es/candidates">Candidatos</a>
      <a href="/es/map">Mapa</a>
      <a href="/es/about">Acerca de</a>
    </nav>

    <button class="chat-toggle" aria-label="Alternar chat" title="Chatear con PDI">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ═══════════════════════════ MAIN ══════════════════════════════ -->
<main class="wrap" x-data="countyExplorer()" x-init="init()">

  <!-- ── Hero ─────────────────────────────────────────────────── -->
  <div class="hero">
    <h1>Explorador de Condados de Wisconsin</h1>
    <p class="hero-subtitle">72 condados · Selecciona un condado para ver indicadores detallados</p>
  </div>

  <!-- ── Search ────────────────────────────────────────────────── -->
  <div class="search-wrap">
    <input
      type="search"
      x-model="countySearch"
      placeholder="Buscar condados por nombre…"
      aria-label="Buscar condados por nombre"
    >
  </div>

  <!-- ── Skeleton loading ──────────────────────────────────────── -->
  <div x-show="countiesLoading" x-cloak>
    <div class="county-grid" aria-hidden="true">
      <template x-for="i in 6" :key="i">
        <div class="card skeleton skeleton-card">
          <div class="skeleton-line skeleton"></div>
          <div class="skeleton-line skeleton"></div>
          <div class="skeleton-line skeleton"></div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Error state ───────────────────────────────────────────── -->
  <div x-show="countiesError" x-cloak class="state-error">
    <span x-text="countiesError"></span>
    <button class="btn btn-ghost" @click="loadCounties()" style="margin-left:1em">Reintentar</button>
  </div>

  <!-- ── County grid ───────────────────────────────────────────── -->
  <div x-show="!countiesLoading && !countiesError && filteredCounties.length > 0" x-cloak>
    <div class="county-grid">
      <template x-for="c in filteredCounties" :key="c.geoid">
        <div
          class="card card-hover county-card"
          @click="window.location = '/es/county?geoid=' + c.geoid"
        >
          <div class="county-card-name" x-text="c.name"></div>
          <div class="county-card-geoid" x-text="c.geoid"></div>
          <div class="county-card-pop">
            <span class="county-card-pop-val" x-text="fmtPop(c.population)"></span>
            <span class="county-card-pop-label">pob.</span>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Empty state ───────────────────────────────────────────── -->
  <div
    x-show="!countiesLoading && !countiesError && filteredCounties.length === 0 && countySearch"
    x-cloak
    class="state-empty"
  >
    <p>Ningún condado coincide con &ldquo;<span x-text="countySearch"></span>&rdquo;</p>
  </div>

</main>

<!-- ═══════════════════════════ FOOTER ═══════════════════════════ -->
<footer class="site-footer">
  Policy Data Infrastructure ·
  <a href="https://github.com/DojoGenesis/policy-data-infrastructure" target="_blank" rel="noopener">DojoGenesis</a>
  · Apache-2.0
</footer>

<!-- ═══════════════════════════ APP LOGIC ════════════════════════ -->
<script>
function countyExplorer() {
  return {
    allCounties: [],
    countiesLoading: false,
    countiesError: '',
    countySearch: '',

    get filteredCounties() {
      if (!this.countySearch.trim()) return this.allCounties;
      const q = this.countySearch.toLowerCase();
      return this.allCounties.filter(c => c.name.toLowerCase().includes(q));
    },

    init() {
      this.loadCounties();
    },

    async loadCounties() {
      this.countiesLoading = true;
      this.countiesError = '';
      try {
        const resp = await fetch('/v1/policy/geographies?level=county&state_fips=55&limit=72');
        if (!resp.ok) throw new Error(`Error de API: ${resp.status} ${resp.statusText}`);
        const data = await resp.json();
        this.allCounties = data.items || [];
      } catch (e) {
        this.countiesError = `Error al cargar condados: ${e.message}`;
      } finally {
        this.countiesLoading = false;
      }
    },

    fmtPop(n) {
      if (n == null) return '\u2014';
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toLocaleString();
    }
  };
}
</script>

<script src="/static/chat-drawer.js"></script>
</body>
</html>
