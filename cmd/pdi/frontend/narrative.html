<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrative Reader — PDI</title>
<meta name="description" content="Policy narrative reader — tract profiles, indicator dashboards, and policy lever recommendations.">

<!-- Design tokens — Night Shift + Rainbow, all colors via var() -->
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/motion.css">

<!-- PDI layout layer — cards, tables, badges, nav -->
<link rel="stylesheet" href="/static/styles.css">

<!-- Alpine.js — local, no CDN -->
<script defer src="/static/alpine.min.js"></script>

<style>
  [x-cloak] { display: none !important; }

  /* ── Narrative Reader · page-specific ───────────────────────────── */

  /* ── Thread divider ribbons ──────────────────────────────────── */
  .thread {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border), transparent);
    margin: var(--section-gap, 48px) 0;
    border: 0;
  }

  /* ── Two-column layout: sidebar + prose ─────────────────────────── */
  .narrative-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: clamp(24px, 4vw, 48px);
    align-items: start;
    max-width: calc(var(--wrap-narrow, 880px) + 220px + 48px);
    margin-inline: auto;
    padding-inline: clamp(16px, 3vw, 24px);
  }

  /* ── Chapter Sidebar ────────────────────────────────────────────── */
  .chapter-sidebar {
    position: sticky;
    top: clamp(80px, 10vw, 100px); /* below site header + some breathing room */
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    scrollbar-width: thin;
  }

  .chapter-sidebar .sidebar-label {
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 0.6em;
  }

  .chapter-sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .chapter-link {
    display: block;
    padding: 0.45em 0.65em;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    border-radius: var(--r-badge);
    border-left: 2px solid transparent;
    transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
  }
  .chapter-link:hover {
    color: var(--text);
    background: var(--surface);
    border-left-color: var(--border-strong);
  }
  .chapter-link.active {
    color: var(--text);
    font-weight: 600;
    border-left-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .chapter-link-num {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    color: var(--accent);
    margin-right: 0.35em;
  }

  /* ── Toolbar (between header and prose) ─────────────────────────── */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: clamp(16px, 2.5vw, 24px);
  }

  .toolbar .btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  /* Copy-toast */
  .copy-toast {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--live);
    animation: toast-in 200ms ease;
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Prose container ──────────────────────────────────────────── */
  .prose {
    padding: 0 0 clamp(48px, 8vw, 96px);
  }

  /* The narrative HTML is self-styled but we override its root to
     use our dark tokens and system fonts. Specificity via .prose parent. */
  .prose :where(h1, h2, h3, h4, h5, h6) {
    color: var(--text);
  }

  .prose :where(p) {
    color: var(--text);
  }

  /* ── Narrative cover override ─────────────────────────────────── */
  .prose .cover {
    background: color-mix(in srgb, var(--accent) 5%, var(--surface));
    color: var(--text);
    border-radius: var(--r-card);
    padding: clamp(40px, 8vw, 80px) clamp(20px, 4vw, 40px);
    margin-bottom: clamp(32px, 5vw, 56px);
  }
  .prose .cover::before { display: none; }
  .prose .cover h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
  }
  .prose .cover .subtitle {
    color: var(--muted);
  }
  .prose .cover-meta {
    color: var(--subtle);
    opacity: 1;
  }
  .prose .cover-scroll { display: none; }

  /* ── Narrative intro ──────────────────────────────────────────── */
  .prose .intro {
    margin-bottom: clamp(24px, 4vw, 40px);
  }
  .prose .intro .lead {
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.7;
  }

  /* ── Narrative TOC ────────────────────────────────────────────── */
  .prose .toc {
    display: none; /* we build our own chapter nav instead */
  }

  /* ── Chapter sections ─────────────────────────────────────────── */
  .prose .chapter {
    max-width: none;
    margin: 0 0 clamp(40px, 6vw, 64px);
    padding: 0;
    border-top: 1px solid var(--border);
    padding-top: clamp(28px, 4vw, 40px);
  }
  .prose .chapter:first-of-type {
    border-top: none;
    padding-top: 0;
  }

  .prose .chapter-header {
    margin-bottom: clamp(20px, 3vw, 32px);
  }
  .prose .chapter-number {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.35em;
  }
  .prose .chapter h2 {
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-weight: 700;
    color: var(--text);
  }
  .prose .chapter-location {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.3em;
  }
  .prose .tier-badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.2em 0.55em;
    border-radius: var(--r-badge);
    margin-left: 0.5em;
    vertical-align: middle;
  }
  .prose .tier-badge.critical {
    color: var(--gated);
    background: color-mix(in srgb, var(--gated) 14%, transparent);
  }
  .prose .tier-badge.warning {
    color: var(--gated);
    background: color-mix(in srgb, var(--gated) 8%, transparent);
  }
  .prose .tier-badge.neutral {
    color: var(--info);
    background: color-mix(in srgb, var(--info) 12%, transparent);
  }
  .prose .tier-badge.positive {
    color: var(--live);
    background: color-mix(in srgb, var(--live) 12%, transparent);
  }

  /* ── Narrative prose text ─────────────────────────────────────── */
  .prose .narrative {
    margin-bottom: clamp(20px, 3vw, 28px);
  }
  .prose .narrative p {
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--text);
    margin-bottom: 1.15em;
  }

  /* ── Stat callout row ─────────────────────────────────────────── */
  .prose .stat-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: clamp(16px, 2.5vw, 24px) 0 clamp(24px, 3.5vw, 32px);
  }
  .prose .stat-block {
    flex: 1 1 130px;
    min-width: 120px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-badge);
    padding: 12px 14px;
    text-align: center;
  }
  .prose .stat-block.critical {
    background: color-mix(in srgb, var(--gated) 8%, var(--surface));
    border-color: color-mix(in srgb, var(--gated) 20%, transparent);
  }
  .prose .stat-block.warning {
    background: color-mix(in srgb, var(--gated) 5%, var(--surface));
    border-color: color-mix(in srgb, var(--gated) 15%, transparent);
  }
  .prose .stat-block.neutral {
    background: color-mix(in srgb, var(--info) 5%, var(--surface));
    border-color: color-mix(in srgb, var(--info) 15%, transparent);
  }
  .prose .stat-block.positive {
    background: color-mix(in srgb, var(--live) 5%, var(--surface));
    border-color: color-mix(in srgb, var(--live) 15%, transparent);
  }
  .prose .stat-big {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text);
    font-family: var(--font-mono);
  }
  .prose .stat-block.critical .stat-big { color: var(--gated); }
  .prose .stat-block.warning  .stat-big { color: var(--gated); }
  .prose .stat-block.neutral  .stat-big { color: var(--info); }
  .prose .stat-block.positive .stat-big { color: var(--live); }
  .prose .stat-label {
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-top: 0.3em;
  }
  .prose .stat-context {
    font-size: 0.62rem;
    color: var(--subtle);
    margin-top: 0.15em;
  }

  /* ── Indicator table ──────────────────────────────────────────── */
  .prose .indicator-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
    margin: clamp(16px, 2.5vw, 28px) 0;
  }
  .prose .indicator-table th {
    text-align: left;
    padding: 0.55em 0.7em;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border-strong);
  }
  .prose .indicator-table td {
    padding: 0.5em 0.7em;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .prose .indicator-table tr:last-child td { border-bottom: none; }
  .prose .indicator-table .val-cell {
    font-weight: 700;
    text-align: right;
    font-family: var(--font-mono);
  }

  /* ── Policy lever box ─────────────────────────────────────────── */
  .prose .policy-lever {
    background: color-mix(in srgb, var(--accent) 5%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--accent) 15%, transparent);
    border-left: 3px solid var(--accent);
    border-radius: var(--r-badge);
    padding: clamp(14px, 2vw, 20px) clamp(16px, 2.5vw, 24px);
    margin: clamp(16px, 2.5vw, 28px) 0;
  }
  .prose .policy-lever-label {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.5em;
  }
  .prose .policy-lever-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.5em;
  }
  .prose .policy-lever p {
    font-size: 0.85rem;
    line-height: 1.65;
    color: var(--muted);
    margin-bottom: 0.6em;
  }
  .prose .policy-lever p:last-child { margin-bottom: 0; }
  .prose .policy-lever .evidence-list {
    list-style: none;
    padding: 0;
    margin: 0.6em 0 0;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.55;
  }
  .prose .policy-lever .evidence-list li {
    padding: 0.3em 0 0.3em 1.2em;
    position: relative;
  }
  .prose .policy-lever .evidence-list li::before {
    content: '→';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  /* ── Section divider ──────────────────────────────────────────── */
  .prose .section-divider {
    display: none;
  }

  /* ── Scope stats (intro) ──────────────────────────────────────── */
  .prose .scope-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: clamp(16px, 2.5vw, 24px) 0;
  }

  /* ── Methodology ──────────────────────────────────────────────── */
  .prose .methodology {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: clamp(20px, 3vw, 36px) clamp(16px, 2.5vw, 28px);
    margin: clamp(32px, 5vw, 56px) 0;
  }
  .prose .methodology-inner {
    max-width: none;
  }
  .prose .methodology h2 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.8em;
  }
  .prose .methodology p {
    font-size: 0.88rem;
    line-height: 1.7;
    color: var(--muted);
  }

  /* ── Footnotes ────────────────────────────────────────────────── */
  .prose .footnotes {
    margin: 0 auto;
    padding: clamp(24px, 4vw, 40px) 0;
    border-top: 1px solid var(--border);
  }
  .prose .footnotes h3 {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.8em;
  }
  .prose .footnotes ol,
  .prose .footnotes ul {
    padding-left: 1.2em;
    font-size: 0.8rem;
    color: var(--subtle);
    line-height: 1.7;
  }
  .prose .footnotes li { margin-bottom: 0.3em; }

  /* ── Generated stamp ──────────────────────────────────────────── */
  .prose .generated-stamp {
    font-size: 0.7rem;
    color: var(--subtle);
    padding: 0 0 24px;
    text-align: center;
  }

  /* ── Skeleton loader ──────────────────────────────────────────── */
  .prose-skeleton {
    padding-top: clamp(24px, 4vw, 40px);
    max-width: 72ch;
    margin-inline: auto;
  }
  .prose-skeleton .skeleton-line {
    height: 0.85em;
    margin-bottom: 0.75em;
    border-radius: 4px;
  }
  .prose-skeleton .skeleton-line:nth-child(1) { width: 60%; height: 1.5em; margin-bottom: 1.25em; }
  .prose-skeleton .skeleton-line:nth-child(2) { width: 90%; }
  .prose-skeleton .skeleton-line:nth-child(3) { width: 85%; }
  .prose-skeleton .skeleton-line:nth-child(4) { width: 92%; }
  .prose-skeleton .skeleton-line:nth-child(5) { width: 70%; margin-bottom: 2em; }
  .prose-skeleton .skeleton-line:nth-child(6) { width: 50%; height: 1.2em; margin-bottom: 1em; }
  .prose-skeleton .skeleton-line:nth-child(7) { width: 88%; }
  .prose-skeleton .skeleton-line:nth-child(8) { width: 75%; }
  .prose-skeleton .skeleton-line:nth-child(9) { width: 82%; }
  .prose-skeleton .skeleton-line:nth-child(10) { width: 65%; }

  /* ── Responsive ───────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .narrative-layout {
      grid-template-columns: 1fr;
      gap: 0;
    }
    .chapter-sidebar {
      position: static;
      max-height: none;
      overflow-y: visible;
      margin-bottom: clamp(16px, 3vw, 24px);
      padding-bottom: clamp(12px, 2vw, 16px);
      border-bottom: 1px solid var(--border);
    }
    .chapter-sidebar nav {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 4px;
    }
    .chapter-link {
      border-left: none;
      border-bottom: 2px solid transparent;
      font-size: 0.72rem;
      padding: 0.35em 0.55em;
    }
    .chapter-link.active {
      border-left: none;
      border-bottom-color: var(--accent);
    }
  }

  @media (max-width: 600px) {
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .prose .stat-row {
      flex-direction: column;
    }
    .prose .indicator-table {
      font-size: 0.72rem;
    }
  }

  /* ── Print ────────────────────────────────────────────────────── */
  @media print {
    .site-header,
    .chapter-sidebar,
    .toolbar {
      display: none !important;
    }
    .narrative-layout {
      display: block;
      max-width: none;
      padding-inline: 0;
    }
    .prose .cover {
      background: #fff !important;
      color: #000 !important;
      border: none !important;
      border-radius: 0 !important;
      padding: 20px 0 !important;
    }
    .prose .chapter {
      page-break-inside: avoid;
    }
    .prose .policy-lever {
      break-inside: avoid;
    }
  }
</style>

<a class="skip-link visually-hidden" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="site-logo">
      <span class="site-logo-accent">PDI</span> Policy Data Infrastructure
    </a>
    <nav class="site-nav">

<main id="main" x-data="narrativeReader()" x-init="init()"
      style="padding-top:clamp(24px,4vw,40px);padding-bottom:clamp(48px,8vw,96px);">

  <!-- ── Toolbar ─────────────────────────────────────────────────── -->
  <div class="toolbar wrap-narrow" x-show="!loading && !error && narrativeHTML">
    <button @click="printPDF()" class="btn btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 12H4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      Print
    </button>

    <button @click="shareLink()" class="btn btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
        <polyline points="16 6 12 2 8 6"/>
        <line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
      Share link

    <span x-show="copied" x-cloak class="copy-toast">Link copied!</span>
  </div>

  <!-- ── Loading · skeleton ──────────────────────────────────────── -->
  <div x-show="loading" x-cloak class="prose-skeleton">
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line"></div>
  </div>

  <!-- ── Error · generation failed ───────────────────────────────── -->
  <div x-show="error && !loading" x-cloak class="state-error">
    <span x-text="error"></span>
    <button @click="loadNarrative()" class="btn btn-ghost" style="font-size:0.8rem;">Retry</button>
  </div>

  <!-- ── Empty · no analysis_id ──────────────────────────────────── -->
  <div x-show="!loading && !error && !analysisId" x-cloak class="state-empty">
    <p>No analysis specified.</p>
    <p style="font-size:0.8rem;color:var(--subtle);margin-top:0.5em;">
      Open a narrative from the County Profile page.
    </p>
  </div>

  <!-- ── Narrative + Sidebar ──────────────────────────────────────── -->
  <div class="narrative-layout reveal" x-show="!loading && !error && narrativeHTML" x-cloak>

    <!-- Chapter Navigation Sidebar -->
    <aside class="chapter-sidebar" x-show="chapters.length > 1">
      <span class="section-tag">Chapters</span>
      <nav aria-label="Chapter navigation">
        <template x-for="ch in chapters" :key="ch.id">
          <a :href="'#' + ch.id"
             class="chapter-link"
             :class="{ active: activeChapter === ch.id }"
             @click.prevent="scrollToChapter(ch.id)">
            <span class="chapter-link-num" x-text="ch.num"></span>
            <span x-text="ch.name"></span>
          </a>
        </template>
      </nav>
    </aside>

    <!-- Prose content -->
    <div class="prose" x-ref="proseContainer" x-html="narrativeHTML"></div>

  </div>

</main>

<script>
function narrativeReader() {
  return {
    analysisId: '',
    narrativeHTML: '',
    loading: true,
    error: '',
    chapters: [],
    activeChapter: '',
    copied: false,
    observer: null,

    /* ── Init ────────────────────────────────────────────────── */
    init() {
      const params = new URLSearchParams(window.location.search);
      this.analysisId = params.get('analysis_id') || '';

      if (!this.analysisId) {
        this.loading = false;
        return;
      }

      this.loadNarrative();
    },

    /* ── Load narrative HTML ──────────────────────────────────── */
    async loadNarrative() {
      this.loading = true;
      this.error = '';
      this.narrativeHTML = '';

      try {
        const base = window.location.origin + '/v1/policy';
        const resp = await fetch(`${base}/generate/narrative/${encodeURIComponent(this.analysisId)}`);

        if (!resp.ok) {
          const text = await resp.text().catch(() => resp.statusText);
          throw new Error(text || `HTTP ${resp.status}`);
        }

        const fullHTML = await resp.text();

        // Extract body content: everything between <body ...> and </body>
        const bodyMatch = fullHTML.match(/<body[^>]*>([\s\S]*)<\/body>/i);
        if (bodyMatch) {
          this.narrativeHTML = bodyMatch[1].trim();
        } else {
          // Fallback: use the full HTML (unlikely path)
          this.narrativeHTML = fullHTML;
        }

        this.loading = false;

        // Wait for Alpine to render the x-html, then build chapter nav
        await this.$nextTick();
        this.buildChapterNav();

      } catch (e) {
        this.error = `Failed to load narrative: ${e.message}`;
        this.loading = false;
      }
    },

    /* ── Build chapter navigation from rendered DOM ───────────── */
    buildChapterNav() {
      const container = this.$refs.proseContainer;
      if (!container) return;

      const chapterEls = container.querySelectorAll('.chapter[id]');
      if (chapterEls.length === 0) return;

      this.chapters = Array.from(chapterEls).map((el, i) => {
        const id = el.id;
        const h2 = el.querySelector('h2');
        const numSpan = el.querySelector('.chapter-number');
        const numText = numSpan ? numSpan.textContent.replace(/^Chapter\s*/i, '').trim() : String(i + 1);
        const name = h2 ? h2.textContent.replace(/\s*<[^>]*>.*/, '').trim() : '';

        return {
          id,
          num: numText,
          name: name || id,
          label: numText ? `${numText} · ${name}` : (name || id),
        };
      });

      // Scroll spy via IntersectionObserver
      this.setupScrollSpy(chapterEls);
    },

    /* ── Scroll spy · highlight active chapter ────────────────── */
    setupScrollSpy(chapterEls) {
      if (this.observer) this.observer.disconnect();

      const options = {
        rootMargin: '-100px 0px -60% 0px',
        threshold: 0,
      };

      this.observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (entry.isIntersecting) {
            this.activeChapter = entry.target.id;
            break; // first visible chapter wins
          }
        }
      }, options);

      chapterEls.forEach(el => this.observer.observe(el));
    },

    /* ── Scroll to chapter ────────────────────────────────────── */
    scrollToChapter(id) {
      const el = document.getElementById(id);
      if (el) {
        const headerH = 64;  // approximate site-header height
        const top = el.getBoundingClientRect().top + window.pageYOffset - headerH - 16;
        window.scrollTo({ top, behavior: 'smooth' });
        this.activeChapter = id;
      }
    },

    /* ── Print ────────────────────────────────────────────────── */
    printPDF() {
      window.print();
    },

    /* ── Share link ───────────────────────────────────────────── */
    async shareLink() {
      try {
        await navigator.clipboard.writeText(window.location.href);
        this.copied = true;
        setTimeout(() => { this.copied = false; }, 2500);
      } catch (e) {
        // Fallback: show the URL
        const input = document.createElement('input');
        input.value = window.location.href;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        this.copied = true;
        setTimeout(() => { this.copied = false; }, 2500);
      }
    },
  };
}
</script>

<script src="/static/chat-drawer.js"></script>
