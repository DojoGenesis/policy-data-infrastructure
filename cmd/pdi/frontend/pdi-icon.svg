<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0a0a14" stroke="url(#g)" stroke-width="8"/>
  <!-- PDI text -->
  <text x="256" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="140" fill="url(#g)" letter-spacing="-2">PDI</text>
  <!-- Subtitle as dots -->
  <circle cx="160" cy="330" r="8" fill="#2563eb" opacity="0.8"/>
  <circle cx="210" cy="330" r="8" fill="#4f46e5" opacity="0.8"/>
  <circle cx="260" cy="330" r="8" fill="#7c3aed" opacity="0.8"/>
  <circle cx="310" cy="330" r="8" fill="#a855f7" opacity="0.8"/>
  <circle cx="360" cy="330" r="8" fill="#ec4899" opacity="0.8"/>
  <!-- Bottom label -->
  <text x="256" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="36" fill="#6b7280" letter-spacing="6">DATA</text>
</svg>
