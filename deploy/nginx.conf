# NOTE: This Docker+nginx path does NOT feed api.policydatainfrastructure.com.
# Production runs via deploy/pdi.service (systemd unit -> pdi serve --port 8340,
# EnvironmentFile=/etc/pdi/env) behind Caddy + Cloudflare, not nginx. This file
# is an unused/alternate lane; server_name below is still an unreplaced
# placeholder ("pdi.yourdomain.com"), which is further evidence it was never
# put into production.
server {
    listen 80;
    server_name pdi.yourdomain.com;

    location / {
        proxy_pass http://localhost:8340;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # long timeout for SSE
        proxy_buffering off;       # required for SSE
    }
}
